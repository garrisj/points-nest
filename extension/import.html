<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Points Nest: import</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #0f172a; background: #f8fafc; margin: 0; }
    main { max-width: 560px; margin: 48px auto; padding: 24px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.5; color: #64748b; margin: 0 0 16px; }
    #import-status { color: #0f172a; min-height: 21px; }
    button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; color: #fff; background: #ef4444; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Import a Points Nest export</h1>
    <p>Choose a file made with the Export button. Import replaces everything stored now, so export your current data first if you may want it back.</p>
    <p><input id="import-file" type="file" accept=".json,application/json"></p>
    <p id="import-status"></p>
    <button id="import-confirm" hidden>Replace current data</button>
  </main>
  <script src="storage.js"></script>
  <script src="owners.js"></script>
  <script src="export.js"></script>
  <script src="import.js"></script>
</body>
</html>
